# http context, independent from analytics. No user, query, cookie or free text.
map $uri $homepage_wardrobe_admin_route {
    default unknown;
    /wardrobe-admin entry;
    /wardrobe-admin/ ui;
    /wardrobe-admin/admin.js script;
    /wardrobe-admin/admin.css style;
    /wardrobe-admin/api/session session;
    /wardrobe-admin/api/garments garments;
    /wardrobe-admin/api/categories categories;
    ~^/wardrobe-admin/api/garments/[0-9a-f-]+$ garment;
    ~^/wardrobe-admin/api/garments/[0-9a-f-]+/delete$ delete;
    ~^/wardrobe-admin/api/garments/[0-9a-f-]+/restore$ restore;
    ~^/wardrobe-admin/images/[0-9a-f-]+/[0-9a-f-]+/(preview|content)$ image;
}
log_format homepage_wardrobe_admin escape=json
    '{"route":"$homepage_wardrobe_admin_route","method":"$request_method",'
    '"status":$status,"request_id":"$request_id","duration":$request_time}';
limit_req_zone $binary_remote_addr zone=homepage_wardrobe_admin:1m rate=60r/m;
