auth_basic "Henson private analytics";
auth_basic_user_file /etc/nginx/homepage-analytics.htpasswd;
limit_req zone=homepage_wardrobe_admin burst=120 nodelay;
limit_req_status 429;
client_max_body_size 64k;
proxy_pass http://unix:/run/homepage-wardrobe-admin/proxy.sock;
proxy_set_header Host zhuyawei.com;
proxy_set_header X-Wardrobe-Admin-User $remote_user;
proxy_set_header Authorization "";
proxy_set_header Proxy-Authorization "";
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-For "";
proxy_set_header Connection "";
proxy_http_version 1.1;
proxy_cache off;
proxy_store off;
proxy_buffering off;
proxy_request_buffering off;
proxy_connect_timeout 2s;
proxy_read_timeout 17s;
proxy_send_timeout 17s;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header ETag;
proxy_hide_header Last-Modified;
proxy_hide_header X-Robots-Tag;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Content-Security-Policy;
proxy_set_header If-None-Match "";
proxy_set_header If-Modified-Since "";
proxy_intercept_errors off;
access_log /var/log/nginx/wardrobe-admin.log homepage_wardrobe_admin;
error_log /var/log/nginx/wardrobe-admin-error.log crit;
etag off;
if_modified_since off;
add_header Cache-Control "no-store" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
