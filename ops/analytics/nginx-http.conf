# http context; dedicated log excludes query strings except allowlisted event fields.
log_format homepage_event escape=json
  '{"time":"$time_iso8601","status":"$status","method":"$request_method",'
  '"ip":"$remote_addr","ua":"$http_user_agent","origin":"$http_referer",'
  '"marker":"$http_x_homepage_event","event":"$arg_e","page":"$arg_p",'
  '"view":"$arg_v","ref":"$arg_r","target":"$arg_t"}';
map "$http_referer|$http_x_homepage_event" $homepage_event_allowed {
    default 0;
    "https://zhuyawei.com/|1" 1;
}
map $status $homepage_event_loggable {
    default 0;
    200 1;
}
limit_req_zone $binary_remote_addr zone=homepage_events:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=homepage_dashboard:1m rate=30r/m;
