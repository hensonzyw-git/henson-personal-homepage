# Include ONLY in the apex zhuyawei.com TLS server.
location = /_events {
    if ($homepage_event_allowed = 0) { return 403; }
    if ($request_method != GET) { return 405; }
    if ($request_uri ~ "^.{2049}") { return 414; }
    limit_req zone=homepage_events burst=30 nodelay;
    limit_req_status 429;
    # Content-phase handler: unlike `return 204`, this runs AFTER rate limiting.
    empty_gif;
    add_header Cache-Control "no-store" always;
    access_log /var/log/homepage-analytics/events.log homepage_event if=$homepage_event_loggable;
}
location = /analytics { return 302 /analytics/; }
location ^~ /analytics/ {
    alias /var/lib/homepage-analytics/dashboard/;
    index index.html;
    autoindex off;
    auth_basic "Henson private analytics";
    auth_basic_user_file /etc/nginx/homepage-analytics.htpasswd;
    limit_req zone=homepage_dashboard burst=30 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}
