<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Open Wardrobe</title>
<desc id="desc">Single-user wardrobe API and MCP. Weather-aware thermal budget. Open source under MIT.</desc>
<rect width="960" height="300" fill="#E7E3D7"/>
