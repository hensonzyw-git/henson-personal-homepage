  <rect x="12" y="70" width="6" height="48" rx="3" fill="#C15F3C" fill-opacity=".7"/>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
  <text x="48" y="68" fill="#C15F3C" font-size="20" letter-spacing="3">OPEN SOURCE / MIT</text>
  <text x="48" y="147" fill="#1F1E1B" font-size="58" font-weight="600">Open Wardrobe</text>
  <path d="M48 188H560" stroke="#1F1E1B" stroke-opacity=".14"/>
