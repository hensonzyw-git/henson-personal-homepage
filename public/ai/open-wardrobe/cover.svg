  <rect x="620" y="104" width="56" height="18" rx="3" fill="#F7F5EF" stroke="#1F1E1B" stroke-opacity=".22"/>
  <rect x="624" y="128" width="48" height="22" rx="3" fill="#EEEBE2" stroke="#1F1E1B" stroke-opacity=".22"/>
  <rect x="628" y="156" width="40" height="28" rx="3" fill="#C15F3C" fill-opacity=".22" stroke="#C15F3C" stroke-opacity=".55"/>
</g>
<g fill="none" stroke="#1F1E1B" stroke-opacity=".14" stroke-width="2">
  <path d="M732 78c18-22 54-22 72 0"/>
  <path d="M768 78v18"/>
  <path d="M738 96h60"/>
